<!DOCTYPE html>
<html>
<head>
    <title>Generate App Icons</title>
</head>
<body>
    <canvas id="canvas" width="512" height="512"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Create a simple icon
        ctx.fillStyle = '#6366f1';
        ctx.fillRect(0, 0, 512, 512);
        
        // Add text
        ctx.fillStyle = 'white';
        ctx.font = 'bold 200px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('H', 256, 256);
        
        // Download 512x512
        const link512 = document.createElement('a');
        link512.download = 'icon-512.png';
        link512.href = canvas.toDataURL();
        link512.click();
        
        // Resize for 192x192
        canvas.width = 192;
        canvas.height = 192;
        ctx.fillStyle = '#6366f1';
        ctx.fillRect(0, 0, 192, 192);
        ctx.fillStyle = 'white';
        ctx.font = 'bold 80px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('H', 96, 96);
        
        const link192 = document.createElement('a');
        link192.download = 'icon-192.png';
        link192.href = canvas.toDataURL();
        link192.click();
    </script>
</body>
</html>
